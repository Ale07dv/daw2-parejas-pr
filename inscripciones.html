<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción - Jornadas de Informática</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Inscripción a las Jornadas de Informática</h1>
        <p>Rellena el formulario para inscribirte.</p>
    </header>

    <main>
        <h2>Formulario de inscripción</h2>

        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="curso">Curso:</label>
            <select id="curso" name="curso" required>
                <option value="">Selecciona un curso</option>
                <option value="1daw">1º DAW</option>
                <option value="2daw">2º DAW</option>
                <option value="1dam">1º DAM</option>
                <option value="2dam">2º DAM</option>
            </select>

            <br><br>

            <button type="submit">Inscribirse</button>
        </form>

        <p>
            <a href="index.html">Volver al inicio</a>
        </p>
    </main>

    <footer>
        <p>Jornadas de Informática - DAW</p>
    </footer>

</body>
</html>
